name: Security login contract
on:
  pull_request:
  push:
    branches: [version-15]
permissions:
  contents: read
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s frappe/tests -p test_security_log_standalone.py
